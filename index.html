<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organización de Tareas</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger-color: #ef4444;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            text-align: center;
            color: var(--text-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: var(--text-color);
            border-radius: 6px;
            font-size: 1rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .status {
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 15px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }

        li.completed span {
            text-decoration: line-through;
            color: #64748b;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            cursor: pointer;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .delete-btn {
            background: transparent;
            color: var(--danger-color);
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Organización de Tareas</h1>
        <div id="status" class="status">Sincronizando con JSONBin...</div>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Añade una nueva tarea..." onkeypress="handleKeyPress(event)">
            <button onclick="agregarTarea()">Añadir</button>
        </div>

        <ul id="taskList">
            <!-- Las tareas se cargarán aquí -->
        </ul>
    </div>

    <script>
        const BIN_ID = "6abd294dac6210605a05dc2e";
        const API_KEY = "$2a$10$tf1X3hIACLNGAsrUX/pkh.qiYCDsaPXuZCl20mvuDr9G1u3H0SKV.";
        
        let tareasData = { tasks: [] };

        const statusEl = document.getElementById('status');
        const taskListEl = document.getElementById('taskList');
        const taskInputEl = document.getElementById('taskInput');

        // Cargar tareas al iniciar la página
        async function cargarTareas() {
            try {
                statusEl.textContent = "Cargando tareas...";
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { "X-Master-Key": API_KEY }
                });
                
                if (!response.ok) throw new Error("Error al conectar con la API");
                
                const data = await response.json();
                // JSONBin guarda el contenido dentro de la propiedad 'record'
                tareasData = data.record || { tasks: [] };
                
                // Asegurar que tasks sea un array
                if (!Array.isArray(tareasData.tasks)) {
                    tareasData.tasks = [];
                }

                renderizarTareas();
                statusEl.textContent = "Sincronizado correctamente";
            } catch (error) {
                console.error(error);
                statusEl.textContent = "Error al cargar las tareas";
            }
        }

        // Guardar tareas en JSONBin
        async function guardarTareas() {
            try {
                statusEl.textContent = "Guardando cambios...";
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Master-Key": API_KEY
                    },
                    body: JSON.stringify(tareasData)
                });

                if (!response.ok) throw new Error("Error al guardar");
                statusEl.textContent = "Sincronizado correctamente";
            } catch (error) {
                console.error(error);
                statusEl.textContent = "Error al guardar los cambios";
            }
        }

        // Renderizar la lista en el HTML
        function renderizarTareas() {
            taskListEl.innerHTML = "";
            
            if (tareasData.tasks.length === 0) {
                taskListEl.innerHTML = `<li style="justify-content: center; color: #64748b;">No hay tareas pendientes</li>`;
                return;
            }

            tareasData.tasks.forEach((task, index) => {
                const li = document.createElement('li');
                if (task.completed) li.classList.add('completed');

                li.innerHTML = `
                    <div class="task-left" onclick="toggleTask(${index})">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask(${index})">
                        <span>${escapeHtml(task.text)}</span>
                    </div>
                    <button class="delete-btn" onclick="eliminarTarea(event, ${index})">Eliminar</button>
                `;
                taskListEl.appendChild(li);
            });
        }

        // Añadir tarea desde el input
        function agregarTarea() {
            const text = taskInputEl.value.trim();
            if (!text) return;

            tareasData.tasks.push({ text: text, completed: false });
            taskInputEl.value = "";
            renderizarTareas();
            guardarTareas();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                agregarTarea();
            }
        }

        // Cambiar estado completado/pendiente
        function toggleTask(index) {
            tareasData.tasks[index].completed = !tareasData.tasks[index].completed;
            renderizarTareas();
            guardarTareas();
        }

        // Eliminar tarea
        function eliminarTarea(event, index) {
            event.stopPropagation();
            tareasData.tasks.splice(index, 1);
            renderizarTareas();
            guardarTareas();
        }

        // Seguridad básica para evitar inyección HTML en las tareas
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Ejecutar carga inicial al abrir la web
        cargarTareas();
    </script>
</body>
</html>
